version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: interviewai-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:alpine
    container_name: interviewai-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interviewai-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/interviewai
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_interviewai_jwt_key_12345
      - JWT_REFRESH_SECRET=super_secret_refresh_key_54321
      - ACCESS_TOKEN_EXPIRY=15m
      - REFRESH_TOKEN_EXPIRY=7d
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interviewai-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  redis-data:
